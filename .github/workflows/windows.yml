name: Windows build

on:
  push:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File Windows\Scripts\build.ps1
          & Windows\build\OpenYap.exe --self-test | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist\OpenYap | Out-Null
          Copy-Item Windows\build\OpenYap.exe, Windows\README.md dist\OpenYap\
          Compress-Archive -Path dist\OpenYap\* -DestinationPath dist\OpenYap-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OpenYap-Windows
          path: dist/OpenYap-Windows.zip
      - name: Attach to release
        if: github.event_name == 'release'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist\OpenYap-Windows.zip --clobber
